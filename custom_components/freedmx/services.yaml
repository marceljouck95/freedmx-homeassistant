set_channels:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: freedmx
    channel:
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 512
          mode: box
    values:
      required: true
      example: "[255, 0, 128]"
      selector:
        object:

save_scene:
  fields:
    name:
      required: true
      example: "Abend"
      selector:
        text:
    lamp_ids:
      required: false
      selector:
        object:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: freedmx
recall_scene:
  fields:
    scene_id:
      required: true
      selector:
        text:
delete_scene:
  fields:
    scene_id:
      required: true
      selector:
        text:
recall_position:
  fields:
    position_id:
      required: true
      selector:
        text:
    lamp_id:
      required: false
      selector:
        text:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: freedmx

aim:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: freedmx
    lamp_id:
      required: true
      selector:
        text:
    x:
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 0.05
          unit_of_measurement: m
    y:
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 0.05
          unit_of_measurement: m

calibrate:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: freedmx
    lamp_id:
      required: true
      selector:
        text:
    x:
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 0.05
          unit_of_measurement: m
    y:
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 0.05
          unit_of_measurement: m

move:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: freedmx
    lamp_id:
      required: true
      selector:
        text:
    pan:
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 0.1
          unit_of_measurement: "%"
    tilt:
      required: true
      selector:
        number:
          min: 0
          max: 100
          step: 0.1
          unit_of_measurement: "%"
    ohne_begrenzung:
      selector:
        boolean:

set_lamp_channel:
  fields:
    lamp_id:
      required: true
      selector:
        text:
    kanal:
      required: true
      selector:
        number:
          min: 1
          max: 64
          mode: box
    wert:
      selector:
        number:
          min: 0
          max: 255
          mode: slider

beat_tap:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: freedmx

beat_align:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: freedmx
    beats:
      required: false
      example: 0.25
      selector:
        number:
          min: -4
          max: 4
          step: 0.05
          mode: box
    eins:
      required: false
      selector:
        boolean:

beat_bpm:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: freedmx
    bpm:
      required: false
      example: 128
      selector:
        number:
          min: 20
          max: 480
          step: 0.1
          mode: box
    faktor:
      required: false
      selector:
        select:
          options:
            - "0.5"
            - "2"

beat_settings:
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: freedmx
    enabled:
      required: false
      selector:
        boolean:
    source:
      required: false
      example: auto
      selector:
        text:
    effect:
      required: false
      selector:
        select:
          options: [aus, puls, blitz, farbe, puls_farbe, lauflicht, wechsel]
    bars:
      required: false
      selector:
        select:
          options: ["1", "2", "4", "8", "16", "32"]
    offset_ms:
      required: false
      selector:
        number:
          min: -1000
          max: 1000
          step: 10
          unit_of_measurement: ms
    intensity:
      required: false
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    lamps:
      required: false
      selector:
        object:
    manual_bpm:
      required: false
      selector:
        number:
          min: 20
          max: 480
          step: 0.1
          mode: box
    palette:
      required: false
      selector:
        select:
          options: [regenbogen, party, warm, kalt, rot_blau, gruen_lila, eigene]
    colors:
      required: false
      example: '["#ff0000", "#0050ff"]'
      selector:
        object:
    rate:
      required: false
      selector:
        select:
          options: ["0.5", "1", "2", "4"]
    auto_lights:
      required: false
      selector:
        boolean:
    auto_pattern:
      required: false
      selector:
        boolean:
    auto_every:
      required: false
      selector:
        select:
          options: ["0", "1", "2", "4"]
    live_bpm:
      required: false
      selector:
        boolean:
    live_interval:
      required: false
      selector:
        select:
          options: ["5", "10"]
